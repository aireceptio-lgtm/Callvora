<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Callvora AI CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Mobile sidebar toggle -->
  <button id="mobile-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()" aria-hidden="true"></div>

  <!-- ───── LOGIN SCREEN ───── -->
  <div id="login-screen" role="main" aria-label="Sign in">
    <div class="login-bg" aria-hidden="true">
      <div class="login-orb-1"></div>
      <div class="login-orb-2"></div>
      <div class="login-grid"></div>
    </div>
    <div class="login-card">
      <div style="display:flex;justify-content:center;margin-bottom:20px">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="sidebar-logo-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M6.5 8C6.5 7.17 7.17 6.5 8 6.5h1.5c.28 0 .53.17.62.43L11.5 10l-1.5 1.25c.75 1.5 1.75 2.5 3.25 3.25L14.5 13l2.95 1.37c.27.12.43.37.43.63V16.5c0 .83-.67 1.5-1.5 1.5H16C10.48 18 6 13.52 6 8v-.5z" fill="#f59e0b"/>
              <path d="M17.5 6.5C18.88 7.88 18.88 10.12 17.5 11.5" stroke="#f59e0b" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
            </svg>
          </div>
          <div class="sidebar-logo-text font-display">
            <span style="color:#f0f4ff">Callvora</span><span style="color:#f59e0b"> AI</span>
          </div>
        </div>
      </div>
      <h1 class="login-title font-display">Welcome back</h1>
      <p class="login-sub">Sign in to your Callvora AI dashboard</p>
      <div id="login-error" class="alert alert-error hidden" role="alert" aria-live="polite">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="login-error-msg"></span>
      </div>
      <div class="form-group">
        <label class="label" for="login-email">Email address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input class="input" type="email" id="login-email" placeholder="you@dealership.com"
            autocomplete="email" maxlength="254"
            onkeydown="if(event.key==='Enter')handleLogin()">
        </div>
      </div>
      <div class="form-group">
        <label class="label" for="login-pass">Password</label>
        <div class="input-pw">
          <input class="input" type="password" id="login-pass" placeholder="••••••••"
            autocomplete="current-password" maxlength="128"
            onkeydown="if(event.key==='Enter')handleLogin()">
          <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Toggle password visibility">
            <svg id="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="button" class="btn btn-primary w-full" id="login-btn"
        style="justify-content:center;padding:12px;margin-top:4px" onclick="handleLogin()">
        Sign in
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </div>
  </div><!-- /login-screen -->

  <!-- ───── APP ───── -->
  <div id="app" style="display:none" aria-label="Callvora AI CRM">

    <!-- Sidebar -->
    <aside id="sidebar" aria-label="Navigation">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M6.5 8C6.5 7.17 7.17 6.5 8 6.5h1.5c.28 0 .53.17.62.43L11.5 10l-1.5 1.25c.75 1.5 1.75 2.5 3.25 3.25L14.5 13l2.95 1.37c.27.12.43.37.43.63V16.5c0 .83-.67 1.5-1.5 1.5H16C10.48 18 6 13.52 6 8v-.5z" fill="#f59e0b"/>
          </svg>
        </div>
        <div class="sidebar-logo-text font-display">
          <span style="color:#f0f4ff">Callvora</span><span style="color:#f59e0b"> AI</span>
        </div>
      </div>
      <div id="admin-pill" class="admin-pill hidden" aria-label="Admin Console">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        ADMIN CONSOLE
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-footer">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 6px 6px">
          <div class="user-avatar" id="user-avatar" aria-hidden="true">AA</div>
          <div class="user-info">
            <div class="user-email" id="user-email-display">user@example.com</div>
            <div class="user-role" id="user-role-display">CLIENT</div>
          </div>
        </div>
        <button onclick="logout()" class="btn btn-ghost w-full sign-out-btn"
          style="justify-content:flex-start;margin-top:4px;font-size:13px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign out
        </button>
      </div>
    </aside><!-- /sidebar -->

    <main id="main">
      <div id="content">
        <div id="page-dashboard" class="page" role="region" aria-label="Dashboard Overview"></div>
        <div id="page-cars" class="page" role="region" aria-label="Car Catalogue"></div>
        <div id="page-leads" class="page" role="region" aria-label="Leads"></div>
        <div id="page-calls" class="page" role="region" aria-label="Call Logs"></div>

        <div id="page-admin" class="page" role="region" aria-label="Admin Overview"></div>
        <div id="page-dealerships" class="page" role="region" aria-label="Dealerships"></div>
        <div id="page-analytics" class="page" role="region" aria-label="Analytics"></div>
        <div id="page-recharge" class="page" role="region" aria-label="Recharge Billing"></div>
        <div id="page-dealer-detail" class="page" role="region" aria-label="Dealer Detail"></div>
        <div id="page-ai-assistant" class="page" role="region" aria-label="CallVora AI Assistant"></div>

        <div id="page-all-vehicles" class="page" role="region" aria-label="All Vehicles"></div>
        <div id="page-all-leads" class="page" role="region" aria-label="All Leads"></div>
        <div id="page-all-calls" class="page" role="region" aria-label="All Calls"></div>
        <div id="page-all-users" class="page" role="region" aria-label="All Users"></div>
      </div>
    </main>

  </div><!-- /app -->

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true">
    <div class="toast-inner">
      <div class="toast-dot" id="toast-dot"></div>
      <span id="toast-msg"></span>
    </div>
  </div>

  <!-- Modal container -->
  <div id="modal-container" role="dialog" aria-modal="true"></div>

  <!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
